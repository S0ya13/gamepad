name: GamepadClient
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SharedProtocol:
    path: ../SharedProtocol
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GamepadClient:
    type: application
    platform: iOS
    sources:
      - GamepadClient
    dependencies:
      - package: SharedProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamepad.client
        INFOPLIST_FILE: GamepadClient/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GamepadClientTests
  GamepadClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GamepadClientTests
    dependencies:
      - target: GamepadClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gamepad.client.tests
